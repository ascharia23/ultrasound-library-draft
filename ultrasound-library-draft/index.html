<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ultrasound Video Library (Draft)</title>

  <!-- ================= CSS: how the page LOOKS ================= -->
  <style>
    :root {
      --bg: #f1f4f6;
      --card: #ffffff;
      --ink: #15252b;
      --muted: #5f7078;
      --line: #d5dde1;
      --accent: #1f6f78;      /* main color: change this to restyle the whole page */
      --accent-soft: #dcecee;
      --warn: #8a5a00;
      --warn-bg: #fff3d6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
    header { background: var(--card); border-bottom: 1px solid var(--line); padding: 18px 16px 14px; }
    .wrap { max-width: 1080px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 26px; }
    .sub { margin: 0; color: var(--muted); }
    .banner { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin-top: 12px; font-size: 14px; }

    .filters { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 16px 0; display: grid; gap: 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .label { font-weight: bold; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); min-width: 92px; }
    select, input[type=search] { font-size: 15px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
    input[type=search] { flex: 1; min-width: 160px; }
    .chip { font-size: 14px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink); cursor: pointer; }
    .chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
    button { font-family: inherit; }
    .primary { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
    .count { color: var(--muted); font-size: 14px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; padding-bottom: 40px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; }
    .card:hover { border-color: var(--accent); }
    .card:focus-visible { outline: 3px solid var(--accent); }
    .thumb { position: relative; background: #000; aspect-ratio: 4 / 3; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .play span { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.88); display: flex; align-items: center; justify-content: center; font-size: 18px; color: #000; padding-left: 3px; }
    .week { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.7); color: #fff; font-size: 12px; font-weight: bold; padding: 3px 8px; border-radius: 6px; }
    .meta { padding: 10px 12px 12px; }
    .meta b { display: block; font-size: 15px; margin-bottom: 4px; }
    .tag { display: inline-block; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: bold; padding: 2px 8px; border-radius: 6px; }
    .empty { text-align: center; color: var(--muted); padding: 40px 10px; grid-column: 1 / -1; }

    /* The pop-up video viewer (also used for presenting) */
    #viewer { position: fixed; inset: 0; background: rgba(8,16,20,.94); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
    #viewer.open { display: flex; }
    #viewer video { width: min(100%, 860px); max-height: 62vh; background: #000; border-radius: 10px; }
    .vinfo { color: #fff; text-align: center; max-width: 760px; margin: 12px 0; }
    .vinfo h2 { margin: 0 0 4px; font-size: 22px; }
    .vinfo p { margin: 6px 0 0; color: #b8c7cd; }
    .vbtns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .vbtns button { background: #1e3a42; color: #fff; border: 1px solid #35606b; border-radius: 8px; padding: 9px 16px; font-size: 15px; cursor: pointer; }
    #vclose { position: absolute; top: 12px; right: 14px; }
    .hint { color: #8fa3ab; font-size: 12px; margin-top: 10px; }
  </style>
</head>

<!-- ================= HTML: what is ON the page ================= -->
<body>
  <header>
    <div class="wrap">
      <h1>Ultrasound Video Library</h1>
      <p class="sub">Browse clips by gestational week and by type of abnormality.</p>
      <div class="banner">Draft sketch. Every clip is a computer-generated placeholder, not a real scan. Categories are examples to be replaced.</div>
    </div>
  </header>

  <main class="wrap">
    <section class="filters" aria-label="Filters">
      <div class="row">
        <span class="label">Week</span>
        <button class="chip" data-tri="all" aria-pressed="true">All weeks</button>
        <button class="chip" data-tri="1" aria-pressed="false">1st trimester (1-13)</button>
        <button class="chip" data-tri="2" aria-pressed="false">2nd trimester (14-27)</button>
        <button class="chip" data-tri="3" aria-pressed="false">3rd trimester (28-40)</button>
      </div>
      <div class="row">
        <span class="label">Exact weeks</span>
        <label>From <select id="from"></select></label>
        <label>to <select id="to"></select></label>
      </div>
      <div class="row">
        <span class="label">Category</span>
        <span id="cats" class="row"></span>
      </div>
      <div class="row">
        <span class="label">Search</span>
        <input type="search" id="q" placeholder="Search by title, e.g. 'profile'">
        <button class="ghost" id="reset">Reset</button>
      </div>
    </section>

    <p class="count"><span id="count"></span><button class="primary" id="present">&#9654; Present these clips</button></p>
    <section class="grid" id="grid" aria-live="polite"></section>
  </main>

  <div id="viewer" role="dialog" aria-modal="true" aria-label="Video viewer">
    <button class="ghost" id="vclose">Close (Esc)</button>
    <video id="vid" controls playsinline></video>
    <div class="vinfo"><h2 id="vtitle"></h2><span class="tag" id="vtag"></span><p id="vdesc"></p></div>
    <div class="vbtns"><button id="prev">&larr; Previous</button><button id="next">Next &rarr;</button></div>
    <div class="hint" id="vhint"></div>
  </div>

  <!-- data.js holds the list of videos. Add a new video by adding an entry there. -->
  <script src="data.js"></script>

  <!-- ================= JavaScript: how the page WORKS ================= -->
  <script>
    // What the user has chosen in the filters
    const state = { from: 1, to: 42, cat: "All", q: "" };
    let shown = [];        // the videos that match the filters right now
    let current = 0;       // position in `shown` of the video that is open
    let autoplayNext = false;  // true when presenting: move on when a clip ends

    const $ = (id) => document.getElementById(id);

    // ---------- Build the filter controls ----------
    function buildControls() {
      for (let w = 1; w <= 42; w++) {
        $("from").add(new Option("Week " + w, w));
        $("to").add(new Option("Week " + w, w));
      }
      $("from").value = state.from;
      $("to").value = state.to;
      const names = ["All"].concat(CATEGORIES);
      names.forEach((name) => {
        const b = document.createElement("button");
        b.className = "chip";
        b.textContent = name;
        b.dataset.cat = name;
        b.setAttribute("aria-pressed", name === "All");
        b.onclick = () => { state.cat = name; refresh(); };
        $("cats").appendChild(b);
      });
    }

    // ---------- Filter the videos, then redraw the grid ----------
    function refresh() {
      const q = state.q.trim().toLowerCase();
      shown = VIDEOS.filter((v) =>
        v.week >= state.from && v.week <= state.to &&
        (state.cat === "All" || v.category === state.cat) &&
        (!q || (v.title + " " + v.category).toLowerCase().includes(q))
      ).sort((a, b) => a.week - b.week);

      $("from").value = state.from;
      $("to").value = state.to;
      document.querySelectorAll("#cats .chip").forEach((b) => b.setAttribute("aria-pressed", b.dataset.cat === state.cat));
      document.querySelectorAll("[data-tri]").forEach((b) => b.setAttribute("aria-pressed", triMatches(b.dataset.tri)));

      $("count").textContent = shown.length + " clip" + (shown.length === 1 ? "" : "s") + " shown";
      $("present").disabled = shown.length === 0;

      const grid = $("grid");
      grid.innerHTML = "";
      if (!shown.length) {
        grid.innerHTML = '<div class="empty">No clips match these filters. Try widening the weeks or choosing All categories.</div>';
        return;
      }
      shown.forEach((v, i) => {
        const card = document.createElement("button");
        card.className = "card";
        card.innerHTML =
          '<div class="thumb"><img alt="" src="' + v.poster + '"><div class="play"><span>&#9654;</span></div><div class="week">Week ' + v.week + '</div></div>' +
          '<div class="meta"><b></b><span class="tag"></span></div>';
        card.querySelector("b").textContent = v.title;
        card.querySelector(".tag").textContent = v.category;
        card.onclick = () => openViewer(i, false);
        grid.appendChild(card);
      });
    }

    const TRI = { all: [1, 42], 1: [1, 13], 2: [14, 27], 3: [28, 40] };
    function triMatches(key) { return state.from === TRI[key][0] && state.to === TRI[key][1]; }

    // ---------- The video viewer ----------
    function openViewer(i, auto) {
      current = i;
      autoplayNext = auto;
      showCurrent();
      $("viewer").classList.add("open");
    }
    function showCurrent() {
      const v = shown[current];
      $("vid").src = v.video;
      $("vid").poster = v.poster;
      $("vid").play().catch(() => {});
      $("vtitle").textContent = v.title + " (week " + v.week + ")";
      $("vtag").textContent = v.category;
      $("vdesc").textContent = v.description;
      $("vhint").textContent = "Clip " + (current + 1) + " of " + shown.length + (autoplayNext ? " - presenting, plays on automatically" : "") + " - use the arrow keys to move";
      $("prev").disabled = current === 0;
      $("next").disabled = current === shown.length - 1;
    }
    function closeViewer() {
      $("viewer").classList.remove("open");
      $("vid").pause();
      $("vid").removeAttribute("src");
    }
    function step(d) {
      const n = current + d;
      if (n < 0 || n >= shown.length) return;
      current = n;
      showCurrent();
    }

    // ---------- Wire up the buttons ----------
    buildControls();
    $("from").onchange = () => { state.from = +$("from").value; if (state.from > state.to) state.to = state.from; refresh(); };
    $("to").onchange = () => { state.to = +$("to").value; if (state.to < state.from) state.from = state.to; refresh(); };
    $("q").oninput = () => { state.q = $("q").value; refresh(); };
    $("reset").onclick = () => { state.from = 1; state.to = 42; state.cat = "All"; state.q = ""; $("q").value = ""; refresh(); };
    document.querySelectorAll("[data-tri]").forEach((b) => {
      b.onclick = () => { state.from = TRI[b.dataset.tri][0]; state.to = TRI[b.dataset.tri][1]; refresh(); };
    });
    $("present").onclick = () => openViewer(0, true);
    $("vclose").onclick = closeViewer;
    $("prev").onclick = () => step(-1);
    $("next").onclick = () => step(1);
    $("vid").addEventListener("ended", () => { if (autoplayNext) step(1); });
    document.addEventListener("keydown", (e) => {
      if (!$("viewer").classList.contains("open")) return;
      if (e.key === "Escape") closeViewer();
      if (e.key === "ArrowRight") step(1);
      if (e.key === "ArrowLeft") step(-1);
    });

    refresh();
  </script>
</body>
</html>
